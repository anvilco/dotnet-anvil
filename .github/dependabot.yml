version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /dev
    schedule:
      interval: weekly
    ignore:
      # Bumped by the Sync API Types workflow, which also regenerates the types
      - dependency-name: "@anvilco/types"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
