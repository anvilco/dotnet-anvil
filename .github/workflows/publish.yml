name: Publish

# Publishes to NuGet when a version tag (like v1.0.0 or v1.0.0-alpha.1) is
# pushed. The publish job waits for a maintainer's approval through the
# `nuget` GitHub environment. See "Publishing" in CONTRIBUTING.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Builds, tests and packs without any permission to publish, so nothing that
  # runs here could get a publishing token.
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          # So we can check that the tag is on main
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Only tag commits that are on main."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag matches the package version
        id: version
        run: |
          VERSION="$(dotnet msbuild src/Anvil/Anvil.csproj -getProperty:Version)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version v$VERSION in src/Anvil/Anvil.csproj."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # v1.0.0 -> false, v1.0.0-alpha.1 / v1.0.0-rc.1 -> true
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - run: dotnet restore
        working-directory: src
      - run: dotnet format --verify-no-changes --no-restore
        working-directory: src
      - run: dotnet build --no-restore -c Release
        working-directory: src
      - run: dotnet test --no-build -c Release
        working-directory: src

      - name: Pack
        run: |
          mkdir -p release/packages
          dotnet pack src/Anvil/Anvil.csproj --no-build -c Release -o release/packages

          # Use this version's CHANGELOG section as the release notes, if there is one
          awk -v header="## [$GITHUB_REF_NAME]" '
            index($0, header) == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found
          ' CHANGELOG.md > release/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    # Waits for a maintainer's approval, if the environment requires reviewers.
    # See "Setup" under "Publishing" in CONTRIBUTING.md.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Anvil/${{ needs.build.outputs.version }}
    permissions:
      # To create the GitHub release
      contents: write
      # For NuGet trusted publishing (OIDC)
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet trusted publishing: nuget.org trusts this repository's workflow
      # for the NUGET_USER account, and hands out a short-lived API key. No
      # secret needed. See "Setup" under "Publishing" in CONTRIBUTING.md.
      - name: Log in to NuGet with trusted publishing
        id: login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          # Trusted publishing when set up, else the NUGET_API_KEY secret
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::No way to publish: set the NUGET_USER repository variable for trusted publishing, or the NUGET_API_KEY secret."
            exit 1
          fi
          # Pushes the .snupkg symbols package alongside
          dotnet nuget push packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [ -s release-notes.md ]; then
            NOTES=(--notes-file release-notes.md)
          else
            NOTES=(--generate-notes)
          fi

          if [ "$PRERELEASE" = "true" ]; then
            LATEST=(--prerelease)
          else
            LATEST=(--latest)
          fi

          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" "${NOTES[@]}" "${LATEST[@]}" packages/*
