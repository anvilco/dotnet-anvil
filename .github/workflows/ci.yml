name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore
        working-directory: src

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore --verbosity diagnostic
        working-directory: src

      - name: Build
        run: dotnet build --no-restore
        working-directory: src

      - name: Test
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ../coverage
        working-directory: src

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      # Not in the solution, so they can't rot unnoticed
      - name: Build the test-client and dev tools
        run: |
          dotnet build test-client
          dotnet build dev/DumpOperations

  check-graphql:
    name: Check GraphQL operations against the schema
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - run: npm ci
        working-directory: dev

      # The client's operations don't match the schema yet (documentGroup.id,
      # forgeSubmit's errorType). Advisory until the operations are brought in
      # line with node-anvil's, then this becomes required.
      - name: Validate the operations
        run: npm run check:graphql
        working-directory: dev
        continue-on-error: true
