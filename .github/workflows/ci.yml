name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore
        working-directory: src

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore --verbosity diagnostic
        working-directory: src

      - name: Build
        run: dotnet build --no-restore
        working-directory: src

      # Line coverage of the hand-written code (the generated Anvil.Types are
      # data) must stay above the threshold. It is 94% as of the 1.0 rewrite.
      - name: Test
        run: >-
          dotnet test --no-build --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutput=../coverage/
          /p:CoverletOutputFormat=cobertura
          /p:Include="[Anvil]*"
          /p:ExcludeByFile="**/Types/GraphQL/*.cs%2c**/Types/Operations/*.cs%2c**/Types/Rest/*.cs"
          /p:Threshold=90
          /p:ThresholdType=line
          /p:ThresholdStat=total
        working-directory: src

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      # Not in the solution, so they can't rot unnoticed
      - name: Build the test-client and dev tools
        run: |
          dotnet build test-client
          dotnet build dev/DumpOperations

  check-graphql:
    name: Check the operations and generated types against the schema
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - run: npm ci
        working-directory: dev

      - name: Check the generated types are up to date with the API specs
        run: npm run check:generated
        working-directory: dev

      - name: Validate the operations
        run: npm run check:graphql
        working-directory: dev
